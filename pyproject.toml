[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheelbot-control-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mujoco", "numpy", "matplotlib"]

[project.scripts]
wheelbot = "wheelbot.cli:main"

[tool.setuptools]
packages = ["wheelbot", "wheelbot.control"]

[tool.setuptools.package-data]
wheelbot = ["model/*.xml", "model/*.obj"]
